# Forked from brandbiz-ai-gateway to run side by side with it on the same
# host: an explicit project `name` keeps volumes/network namespaced
# separately from the source repo (Compose defaults the project name to the
# directory name, which already differs — this just makes it unmissable),
# and host ports are shifted +100 (backend 8000->8100, frontend 3000->3100,
# hermes-docker profile 8642->8742) so both stacks can be `up` at once.
# Container-to-container URLs (BACKEND_URL, postgres, etc.) are untouched.
name: brandbiz-client-workspace

services:
  postgres:
    runtime: runc
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: brandbiz
      POSTGRES_USER: brandbiz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brandbiz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]
    restart: unless-stopped

  backend-api:
    build: ./backend
    runtime: runc
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8100:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: brandbiz
      POSTGRES_USER: brandbiz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      LLM_PRIMARY_URL: ${LLM_PRIMARY_URL:-http://192.168.20.18:12341}
      LLM_PRIMARY_MODEL: ${LLM_PRIMARY_MODEL:-gemma4:26b}
      # Embedding server — point at the same Ollama host; model must be pulled first
      # e.g. `ollama pull bge-m3:latest` on the server
      LLM_EMBED_URL: ${LLM_EMBED_URL:-http://192.168.20.18:12341}
      LLM_EMBED_MODEL: ${LLM_EMBED_MODEL:-bge-m3:latest}
      # Release VRAM after each request so models share one GPU on demand.
      LLM_KEEP_ALIVE: ${LLM_KEEP_ALIVE:-0}
      # Local blob storage (volume-mounted below)
      FILE_STORAGE_DIR: /data/files
      COOKIE_SECURE: "false"
      CORS_ORIGINS: '["http://localhost:3100"]'
      # D21/D22 — event kill switch for /client/*, /public/*, /admin/clients/*.
      # On by default; must be wired here because the container has no .env
      # file (pydantic's env_file is a no-op inside the image).
      CLIENT_SURFACE_ENABLED: ${CLIENT_SURFACE_ENABLED:-true}
      # D23 — let client-workspace seats use the full internal app. Off by
      # default; see .env.example for details.
      CLIENT_INTERNAL_ACCESS_ENABLED: ${CLIENT_INTERNAL_ACCESS_ENABLED:-false}
      # LINE Login (0063) — the client entry point. Blank channel id leaves
      # POST /public/line/login disabled (503) and /public/redeem as the way
      # in. Wired explicitly for the same reason as the flags above: the
      # container has no .env file.
      LINE_LOGIN_CHANNEL_ID: ${LINE_LOGIN_CHANNEL_ID:-}
      LINE_LOGIN_CHANNEL_SECRET: ${LINE_LOGIN_CHANNEL_SECRET:-}
      LINE_LIFF_ID: ${LINE_LIFF_ID:-}
      # One run through the funnel per LINE identity — enforced at POST
      # /client/engagements, not at the door.
      CLIENT_SINGLE_ENGAGEMENT: ${CLIENT_SINGLE_ENGAGEMENT:-true}
      # The published Agent cloned into each self-serve LINE workspace as
      # its น้องภูมิ persona. Blank leaves those workspaces agent-less, which
      # 503s POST /client/plan/draft — see .env.example.
      CLIENT_TEMPLATE_AGENT_ID: ${CLIENT_TEMPLATE_AGENT_ID:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      # Hermes Agent — runs natively on the Docker host by default (see
      # .env.example for install/run steps); host.docker.internal (via
      # extra_hosts below) lets this container reach it. To run it in Docker
      # instead: `docker compose --profile hermes-docker up -d` and set
      # HERMES_API_URL=http://hermes:8642/v1.
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      HERMES_API_URL: ${HERMES_API_URL:-http://host.docker.internal:8642/v1}
      HERMES_API_TIMEOUT: ${HERMES_API_TIMEOUT:-600}
      # Only used to render the downloadable host-setup script (Tasks page);
      # the same vars also feed hermes-init when the hermes-docker profile runs.
      HERMES_OLLAMA_URL: ${HERMES_OLLAMA_URL:-http://192.168.20.18:12341/v1}
      HERMES_OLLAMA_MODEL: ${HERMES_OLLAMA_MODEL:-hermes3:8b}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      # Obsidian vault sync — leave VAULT_GIT_URL unset to disable
      VAULT_GIT_URL: ${VAULT_GIT_URL:-}
      VAULT_DIR: /data/vault
      VAULT_BRANCH: ${VAULT_BRANCH:-main}
      VAULT_BOT_EMAIL: ${VAULT_BOT_EMAIL:-obsidian-bot@service.local}
    healthcheck:
      # Use HTTP/1.0: http.client's default HTTP/1.1 keep-alive mode causes a
      # ~3-second recv() stall on Docker's loopback before the status line
      # is returned, making the check unreliable with short timeouts.
      test: ["CMD", "python", "-c",
        "import http.client,sys; c=http.client.HTTPConnection('127.0.0.1',8000,timeout=5); c._http_vsn=10; c._http_vsn_str='HTTP/1.0'; c.request('GET','/health'); r=c.getresponse(); sys.exit(0 if r.status==200 else 1)"]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 20s
    volumes:
      - files_data:/data/files
      - vault_data:/data/vault
    extra_hosts:
      # Resolve host.docker.internal on Linux engines too (no-op on Docker
      # Desktop, where the name already resolves) — used to reach the
      # host-installed Hermes Agent.
      - "host.docker.internal:host-gateway"
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  # Optional Docker fallback for Hermes (default is a native host install —
  # see .env.example). Opt in with: docker compose --profile hermes-docker up -d
  #
  # One-shot: writes Hermes's config.yaml/.env into hermes_data on first boot
  # only (never overwrites, so live sessions/memory/skills persist across
  # restarts). Keeps the Hermes container image itself unmodified/official.
  hermes-init:
    profiles: ["hermes-docker"]
    image: alpine:3.20
    runtime: runc
    environment:
      # NOT `:?required` — Compose interpolates every service in the file,
      # including ones behind an inactive profile, so a `:?` here would fail
      # *any* compose command whenever HERMES_API_KEY is blank (which
      # .env.example documents as the way to disable Hermes). The requirement
      # is enforced in the entrypoint below, which only runs under the profile.
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      HERMES_OLLAMA_URL: ${HERMES_OLLAMA_URL:-http://192.168.20.18:12341/v1}
      HERMES_OLLAMA_MODEL: ${HERMES_OLLAMA_MODEL:-hermes3:8b}
    volumes:
      - hermes_data:/opt/data
    entrypoint: sh
    command:
      - -c
      - |
        set -e
        if [ -z "$${HERMES_API_KEY}" ]; then
          echo "hermes-init: HERMES_API_KEY must be set to run the hermes-docker profile" >&2
          exit 1
        fi
        if [ ! -f /opt/data/config.yaml ]; then
          cat > /opt/data/config.yaml <<EOF
        model:
          provider: custom
          model: ${HERMES_OLLAMA_MODEL}
          base_url: ${HERMES_OLLAMA_URL}
          api_key: "none"
        EOF
          echo "wrote /opt/data/config.yaml"
        fi
        if [ ! -f /opt/data/.env ]; then
          cat > /opt/data/.env <<EOF
        API_SERVER_ENABLED=true
        API_SERVER_HOST=0.0.0.0
        API_SERVER_PORT=8642
        API_SERVER_KEY=${HERMES_API_KEY}
        EOF
          echo "wrote /opt/data/.env"
        fi
    restart: "no"

  hermes:
    profiles: ["hermes-docker"]
    image: nousresearch/hermes-agent:latest
    runtime: runc
    command: ["gateway", "run"]
    ports:
      - "8742:8642"
    volumes:
      - hermes_data:/opt/data
    networks: [internal]
    depends_on:
      hermes-init:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend-chat:
    runtime: runc
    build:
      context: ./frontend-chat
      target: runner
    ports:
      - "3100:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8100
      BACKEND_URL: http://backend-api:8000
      NODE_ENV: development
      # Read at request time by app/try/page.tsx, not baked in at build —
      # the same image can point at a different LINE channel.
      LINE_LIFF_ID: ${LINE_LIFF_ID:-}
    networks: [internal]
    depends_on:
      backend-api:
        condition: service_healthy
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  files_data:
  vault_data:
  hermes_data:
