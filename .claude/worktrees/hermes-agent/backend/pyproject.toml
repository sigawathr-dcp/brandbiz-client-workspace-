[project]
name = "brandbiz-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0,<3",
    "alembic>=1.13,<2",
    "asyncpg>=0.29",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "pgvector>=0.3",
    "httpx>=0.28",
    "cryptography>=43,<44",
    "langgraph>=0.2,<0.3",
    "langchain-core>=0.2",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "bcrypt>=4.1,<5",
]

[project.optional-dependencies]
external = [
    "anthropic>=0.34",
    "openai>=1.40",
    "google-genai>=1.5",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-docker>=3",
    "httpx>=0.27",
    "locust>=2.31",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
